```html
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>学祭 サークル作品展示</title>

  <style>
    :root {
      font-family: system-ui,-apple-system,"Noto Sans JP",sans-serif;
      color:#172033;
      background:#f2f5fb;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
    }

    header {
      background:linear-gradient(120deg,#172554,#4338ca);
      color:white;
      padding:46px 20px;
      text-align:center;
    }

    header h1 {
      font-size:clamp(1.7rem,5vw,2.8rem);
      margin:0 0 10px;
      letter-spacing:.06em;
    }

    header p {
      margin:0;
      color:#e0e7ff;
    }

    main {
      max-width:900px;
      margin:28px auto;
      padding:0 18px 40px;
    }

    /* =========================
       カテゴリボタン
    ========================= */

    .category-menu {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-bottom:28px;
    }

    .category-button {
      border:2px solid #c7d2fe;
      background:white;
      color:#3730a3;
      border-radius:14px;
      padding:16px 8px;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
      transition:.2s;
    }

    .category-button:hover {
      background:#eef2ff;
      transform:translateY(-2px);
    }

    .category-button.active {
      background:#4338ca;
      border-color:#4338ca;
      color:white;
    }

    /* =========================
       検索
    ========================= */

    .toolbar {
      display:flex;
      gap:10px;
      align-items:center;
      margin-bottom:20px;
      flex-wrap:wrap;
    }

    input {
      flex:1;
      min-width:180px;
      padding:13px 15px;
      border:1px solid #cbd5e1;
      border-radius:12px;
      font-size:1rem;
    }

    #count {
      color:#64748b;
      font-size:.9rem;
    }

    /* =========================
       ゲーム
    ========================= */

    #games {
      display:grid;
      gap:18px;
    }

    .game {
      background:white;
      border:1px solid #e2e8f0;
      border-radius:17px;
      padding:22px;
      box-shadow:0 5px 18px #1e293b0d;
    }

    .heading {
      display:flex;
      gap:16px;
      align-items:center;
    }

    .game-image {
      width:100px;
      height:100px;
      object-fit:cover;
      border-radius:14px;
      flex-shrink:0;
      background:#e2e8f0;
    }

    h2 {
      margin:0 0 6px;
      font-size:1.25rem;
    }

    .author {
      margin:0;
      color:#475569;
    }

    .genre {
      display:inline-block;
      background:#e0e7ff;
      color:#3730a3;
      border-radius:100px;
      padding:4px 11px;
      font-size:.82rem;
      margin-top:12px;
    }

    .url {
      display:block;
      color:#2563eb;
      overflow-wrap:anywhere;
      font-size:.9rem;
      margin:16px 0 12px;
      text-decoration:underline;
    }

    .comment-area {
      margin-top:15px;
      padding:14px 16px;
      background:#f8fafc;
      border-left:4px solid #6366f1;
      border-radius:8px;
    }

    .comment {
      margin:0;
      color:#475569;
      line-height:1.7;
      white-space:pre-wrap;
    }

    .comment.collapsed {
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:3;
      overflow:hidden;
    }

    .more-button {
      border:0;
      background:none;
      color:#2563eb;
      font-weight:700;
      padding:7px 0 0;
      cursor:pointer;
      font-size:.9rem;
    }

    /* =========================
       音楽・動画
    ========================= */

    .media-list {
      display:grid;
      gap:18px;
    }

    .media-card {
      background:white;
      border:1px solid #e2e8f0;
      border-radius:17px;
      padding:22px;
      box-shadow:0 5px 18px #1e293b0d;
    }

    .media-card h2 {
      margin-bottom:7px;
    }

    .media-card audio {
      width:100%;
      margin-top:16px;
    }

    .media-card video {
      display:block;
      width:100%;
      max-height:500px;
      margin-top:16px;
      border-radius:12px;
      background:black;
    }

    /* =========================
       イラスト
    ========================= */

    .illustration-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    .illustration-card {
      background:white;
      border:1px solid #e2e8f0;
      border-radius:15px;
      overflow:hidden;
      box-shadow:0 5px 18px #1e293b0d;
    }

    .illustration-card img {
      display:block;
      width:100%;
      aspect-ratio:1 / 1;
      object-fit:cover;
      cursor:pointer;
      transition:.2s;
    }

    .illustration-card img:hover {
      transform:scale(1.03);
    }

    .illustration-info {
      padding:12px;
      text-align:center;
    }

    .illustration-title {
      margin:0 0 4px;
      font-weight:700;
    }

    .illustration-author {
      margin:0;
      color:#64748b;
      font-size:.9rem;
    }

    /* =========================
       イラスト拡大画面
    ========================= */

    .modal {
      display:none;
      position:fixed;
      z-index:1000;
      inset:0;
      background:rgba(0,0,0,.88);
      align-items:center;
      justify-content:center;
      padding:30px;
    }

    .modal.open {
      display:flex;
    }

    .modal-content {
      position:relative;
      max-width:95vw;
      max-height:95vh;
      text-align:center;
    }

    .modal img {
      max-width:90vw;
      max-height:82vh;
      object-fit:contain;
      border-radius:8px;
    }

    .modal-info {
      color:white;
      margin-top:10px;
    }

    .modal-info p {
      margin:3px;
    }

    .close-modal {
      position:fixed;
      top:20px;
      right:30px;
      border:0;
      background:none;
      color:white;
      font-size:2.5rem;
      cursor:pointer;
    }

    /* =========================
       その他
    ========================= */

    .section {
      display:none;
    }

    .section.active {
      display:block;
    }

    .section-title {
      margin:0 0 20px;
      font-size:1.5rem;
    }

    footer {
      text-align:center;
      color:#64748b;
      font-size:.85rem;
      padding:0 20px 35px;
    }

    @media(max-width:600px) {

      .category-menu {
        grid-template-columns:repeat(2,1fr);
      }

      .illustration-grid {
        grid-template-columns:repeat(2,1fr);
      }

      .game {
        padding:16px;
      }

      .game-image {
        width:80px;
        height:80px;
      }

    }

  </style>
</head>

<body>

<header>
  <h1>🎨 CREATIVE EXHIBITION</h1>
  <p>学祭 サークル作品展示</p>
</header>

<main>

  <!-- =========================
       カテゴリ
  ========================== -->

  <nav class="category-menu">

    <button
      class="category-button active"
      data-section="game-section">
      🎮 ゲーム
    </button>

    <button
      class="category-button"
      data-section="music-section">
      🎵 音楽
    </button>

    <button
      class="category-button"
      data-section="video-section">
      🎬 動画
    </button>

    <button
      class="category-button"
      data-section="illustration-section">
      🎨 イラスト
    </button>

  </nav>


  <!-- =========================
       ゲーム
  ========================== -->

  <section id="game-section" class="section active">

    <h1 class="section-title">🎮 ゲーム作品</h1>

    <div class="toolbar">

      <input
        id="search"
        type="search"
        placeholder="作品名・作者名・ジャンルで検索"
      >

      <span id="count"></span>

    </div>

    <div id="games"></div>

  </section>


  <!-- =========================
       音楽
  ========================== -->

  <section id="music-section" class="section">

    <h1 class="section-title">🎵 音楽作品</h1>

    <div id="musics" class="media-list"></div>

  </section>


  <!-- =========================
       動画
  ========================== -->

  <section id="video-section" class="section">

    <h1 class="section-title">🎬 動画作品</h1>

    <div id="videos" class="media-list"></div>

  </section>


  <!-- =========================
       イラスト
  ========================== -->

  <section id="illustration-section" class="section">

    <h1 class="section-title">🎨 イラスト作品</h1>

    <div id="illustrations" class="illustration-grid"></div>

  </section>

</main>


<!-- イラスト拡大画面 -->

<div id="imageModal" class="modal">

  <button
    id="closeModal"
    class="close-modal">
    ×
  </button>

  <div class="modal-content">

    <img id="modalImage" src="" alt="">

    <div class="modal-info">

      <p id="modalTitle"></p>

      <p id="modalAuthor"></p>

    </div>

  </div>

</div>


<footer>
  サークル作品展示
</footer>


<script>

/* ==================================================
   ここから作品データ
================================================== */


/* =========================
   ゲーム
========================= */

const games = [

  {
    title:"I AM DICE",
    author:"みつのみや",
    genre:"その他",
    image:"images/games/space-shooter.png",
    url:"https://unityroom.com/games/iamdice",
    comment:"さいころを転がすゲームです。"
  },

  {
    title:"迷宮からの脱出",
    author:"佐藤 花子",
    genre:"謎解き",
    image:"images/games/meikyu.png",
    url:"https://unityroom.com/games/example2",
    comment:"迷宮に隠されたヒントを探して脱出を目指すゲームです。"
  },

  {
    title:"ねこの大冒険",
    author:"鈴木 一郎",
    genre:"アクション",
    image:"images/games/neko.png",
    url:"https://unityroom.com/games/example3",
    comment:"猫を操作してゴールを目指すアクションゲームです。"
  }

];


/* =========================
   音楽

   src にMP3ファイルを書く
========================= */

const musics = [

  {
    title:"星空",
    author:"佐藤 花子",
    src:"music/hoshizora.mp3"
  },

  {
    title:"Adventure",
    author:"山田 太郎",
    src:"music/adventure.mp3"
  },

  {
    title:"夜の街",
    author:"鈴木 一郎",
    src:"music/night.mp3"
  }

];


/* =========================
   動画

   src にMP4ファイルを書く
========================= */

const videos = [

  {
    title:"自主制作アニメーション",
    author:"田中 美咲",
    src:"videos/animation.mp4"
  },

  {
    title:"3DCG作品",
    author:"高橋 健",
    src:"videos/3dcg.mp4"
  }

];


/* =========================
   イラスト
========================= */

const illustrations = [

  {
    title:"星空",
    author:"佐藤 花子",
    image:"images/illustrations/hoshizora.jpg"
  },

  {
    title:"街",
    author:"山田 太郎",
    image:"images/illustrations/city.jpg"
  },

  {
    title:"猫",
    author:"鈴木 一郎",
    image:"images/illustrations/cat.jpg"
  },

  {
    title:"海",
    author:"田中 美咲",
    image:"images/illustrations/sea.jpg"
  },

  {
    title:"森",
    author:"高橋 健",
    image:"images/illustrations/forest.jpg"
  },

  {
    title:"夜景",
    author:"伊藤 葵",
    image:"images/illustrations/night.jpg"
  }

];


/* ==================================================
   カテゴリ切り替え
================================================== */

const categoryButtons =
  document.querySelectorAll(".category-button");

const sections =
  document.querySelectorAll(".section");


categoryButtons.forEach(button => {

  button.addEventListener("click", () => {

    categoryButtons.forEach(b =>
      b.classList.remove("active")
    );

    sections.forEach(section =>
      section.classList.remove("active")
    );

    button.classList.add("active");

    document
      .getElementById(button.dataset.section)
      .classList.add("active");

  });

});


/* ==================================================
   ゲーム
================================================== */

const gameList =
  document.getElementById("games");

const count =
  document.getElementById("count");

const search =
  document.getElementById("search");


function renderGames() {

  const q =
    search.value.trim().toLocaleLowerCase();


  const found = games.filter(g =>

    [g.title,g.author,g.genre]

      .some(s =>
        s.toLocaleLowerCase().includes(q)
      )

  );


  count.textContent =
    `${found.length}作品`;


  gameList.replaceChildren();


  for(const g of found) {

    const article =
      document.createElement("article");

    article.className =
      "game";


    const heading =
      document.createElement("div");

    heading.className =
      "heading";


    const image =
      document.createElement("img");

    image.className =
      "game-image";

    image.src =
      g.image;

    image.alt =
      g.title;


    const info =
      document.createElement("div");


    const title =
      document.createElement("h2");

    title.textContent =
      g.title;


    const author =
      document.createElement("p");

    author.className =
      "author";

    author.textContent =
      `作者：${g.author}`;


    info.append(
      title,
      author
    );


    heading.append(
      image,
      info
    );


    const genre =
      document.createElement("span");

    genre.className =
      "genre";

    genre.textContent =
      g.genre;


    const url =
      document.createElement("a");

    url.className =
      "url";

    url.textContent =
      g.url;

    url.href =
      g.url;

    url.target =
      "_blank";

    url.rel =
      "noopener noreferrer";


    const commentArea =
      document.createElement("div");

    commentArea.className =
      "comment-area";


    const comment =
      document.createElement("p");

    comment.className =
      "comment collapsed";

    comment.textContent =
      g.comment;


    const more =
      document.createElement("button");

    more.className =
      "more-button";

    more.textContent =
      "もっと見る ▼";


    more.onclick = () => {

      const collapsed =
        comment.classList.toggle(
          "collapsed"
        );

      more.textContent =
        collapsed
          ? "もっと見る ▼"
          : "閉じる ▲";

    };


    commentArea.append(
      comment,
      more
    );


    article.append(
      heading,
      genre,
      url,
      commentArea
    );


    gameList.append(article);

  }

}


search.addEventListener(
  "input",
  renderGames
);


renderGames();


/* ==================================================
   音楽
================================================== */

const musicList =
  document.getElementById("musics");


for(const music of musics) {

  const card =
    document.createElement("article");

  card.className =
    "media-card";


  const title =
    document.createElement("h2");

  title.textContent =
    music.title;


  const author =
    document.createElement("p");

  author.className =
    "author";

  author.textContent =
    `作者：${music.author}`;


  const audio =
    document.createElement("audio");

  audio.controls =
    true;

  audio.preload =
    "metadata";

  audio.src =
    music.src;


  card.append(
    title,
    author,
    audio
  );


  musicList.append(card);

}


/* ==================================================
   動画
================================================== */

const videoList =
  document.getElementById("videos");


for(const videoData of videos) {

  const card =
    document.createElement("article");

  card.className =
    "media-card";


  const title =
    document.createElement("h2");

  title.textContent =
    videoData.title;


  const author =
    document.createElement("p");

  author.className =
    "author";

  author.textContent =
    `作者：${videoData.author}`;


  const video =
    document.createElement("video");

  video.controls =
    true;

  video.preload =
    "metadata";

  video.src =
    videoData.src;


  card.append(
    title,
    author,
    video
  );


  videoList.append(card);

}


/* ==================================================
   イラスト
================================================== */

const illustrationList =
  document.getElementById("illustrations");

const modal =
  document.getElementById("imageModal");

const modalImage =
  document.getElementById("modalImage");

const modalTitle =
  document.getElementById("modalTitle");

const modalAuthor =
  document.getElementById("modalAuthor");

const closeModal =
  document.getElementById("closeModal");


for(const illust of illustrations) {

  const card =
    document.createElement("article");

  card.className =
    "illustration-card";


  const image =
    document.createElement("img");

  image.src =
    illust.image;

  image.alt =
    illust.title;


  const info =
    document.createElement("div");

  info.className =
    "illustration-info";


  const title =
    document.createElement("p");

  title.className =
    "illustration-title";

  title.textContent =
    illust.title;


  const author =
    document.createElement("p");

  author.className =
    "illustration-author";

  author.textContent =
    `作者：${illust.author}`;


  info.append(
    title,
    author
  );


  card.append(
    image,
    info
  );


  illustrationList.append(card);


  /* クリックすると拡大 */

  image.addEventListener(
    "click",
    () => {

      modalImage.src =
        illust.image;

      modalTitle.textContent =
        illust.title;

      modalAuthor.textContent =
        `作者：${illust.author}`;

      modal.classList.add(
        "open"
      );

    }
  );

}


/* ×で閉じる */

closeModal.addEventListener(
  "click",
  () => {

    modal.classList.remove(
      "open"
    );

  }
);


/* 黒い部分をクリックしても閉じる */

modal.addEventListener(
  "click",
  e => {

    if(e.target === modal) {

      modal.classList.remove(
        "open"
      );

    }

  }
);


/* ESCでも閉じる */

document.addEventListener(
  "keydown",
  e => {

    if(e.key === "Escape") {

      modal.classList.remove(
        "open"
      );

    }

  }
);

</script>

</body>
</html>
```

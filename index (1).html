```html
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>学祭ゲーム作品展示</title>

  <style>
    :root {
      font-family: system-ui,-apple-system,"Noto Sans JP",sans-serif;
      color:#172033;
      background:#f2f5fb;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
    }

    header {
      background:linear-gradient(120deg,#172554,#4338ca);
      color:white;
      padding:46px 20px;
      text-align:center;
    }

    header h1 {
      font-size:clamp(1.7rem,5vw,2.8rem);
      margin:0 0 10px;
      letter-spacing:.06em;
    }

    header p {
      margin:0;
      color:#e0e7ff;
    }

    main {
      max-width:800px;
      margin:28px auto;
      padding:0 18px 40px;
    }

    .toolbar {
      display:flex;
      gap:10px;
      align-items:center;
      margin-bottom:20px;
      flex-wrap:wrap;
    }

    input {
      flex:1;
      min-width:180px;
      padding:13px 15px;
      border:1px solid #cbd5e1;
      border-radius:12px;
      font-size:1rem;
    }

    #count {
      color:#64748b;
      font-size:.9rem;
    }

    #games {
      display:grid;
      gap:18px;
    }

    .game {
      background:white;
      border:1px solid #e2e8f0;
      border-radius:17px;
      padding:22px;
      box-shadow:0 5px 18px #1e293b0d;
    }

    .heading {
      display:flex;
      gap:16px;
      align-items:center;
    }

    /* ゲーム画像 */
    .game-image {
      width:100px;
      height:100px;
      object-fit:cover;
      border-radius:14px;
      flex-shrink:0;
      background:#e2e8f0;
    }

    h2 {
      margin:0 0 6px;
      font-size:1.25rem;
    }

    .author {
      margin:0;
      color:#475569;
    }

    .genre {
      display:inline-block;
      background:#e0e7ff;
      color:#3730a3;
      border-radius:100px;
      padding:4px 11px;
      font-size:.82rem;
      margin-top:12px;
    }

    .url {
      display:block;
      color:#2563eb;
      overflow-wrap:anywhere;
      font-size:.9rem;
      margin:16px 0 12px;
      text-decoration:underline;
    }

    .url:hover {
      color:#1d4ed8;
    }

    /* コメント */
    .comment-area {
      margin-top:15px;
      padding:14px 16px;
      background:#f8fafc;
      border-left:4px solid #6366f1;
      border-radius:8px;
    }

    .comment {
      margin:0;
      color:#475569;
      line-height:1.7;
      white-space:pre-wrap;
    }

    /* 最初は3行だけ */
    .comment.collapsed {
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:3;
      overflow:hidden;
    }

    .more-button {
      border:0;
      background:none;
      color:#2563eb;
      font-weight:700;
      padding:7px 0 0;
      cursor:pointer;
      font-size:.9rem;
    }

    .more-button:hover {
      text-decoration:underline;
    }

    .notice {
      background:#fff7ed;
      border:1px solid #fed7aa;
      padding:13px 15px;
      border-radius:10px;
      color:#9a3412;
      margin-bottom:18px;
      font-size:.9rem;
    }

    footer {
      text-align:center;
      color:#64748b;
      font-size:.85rem;
      padding:0 20px 35px;

    @media(max-width:480px) {
      .game {
        padding:16px;
      }

      .game-image {
        width:80px;
        height:80px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎮 GAME EXHIBITION</h1>
  <p>学祭 サークル作品展示 ｜ 気になるゲームを選んで遊ぼう！</p>
</header>

<main>

  <div class="notice">
    これはテスト用サイトです。作品名・作者名・URLはサンプルです。
    実際の展示前に書き換えてください。
  </div>

  <div class="toolbar">
    <input
      id="search"
      type="search"
      placeholder="作品名・作者名・ジャンルで検索"
      aria-label="作品を検索"
    >
    <span id="count"></span>
  </div>

  <section id="games" aria-label="作品一覧"></section>

</main>

<footer>
  サークル作品展示 ｜ ゲームのプレイ後はこのタブに戻ってください
</footer>

<script>

/*
==================================================
 ★ 作品を追加・編集する場所
==================================================

 title   : 作品名
 author  : 作者名
 genre   : ジャンル
 image   : ゲーム画像
 url     : ゲームのURL
 comment : 作者コメント
*/

const games = [

  {
    title: "スペースシューター",
    author: "山田 太郎",
    genre: "シューティング",
    image: "images/space-shooter.png",
    url: "https://www.youtube.com/",
    comment: "宇宙を舞台にしたシューティングゲームです。敵の攻撃を避けながらハイスコアを目指してください。操作はシンプルですが、後半になるほど敵の攻撃が激しくなります。ぜひ最後まで遊んでみてください！"
  },

  {
    title: "迷宮からの脱出",
    author: "佐藤 花子",
    genre: "謎解き",
    image: "images/meikyu.png",
    url: "https://unityroom.com/games/example2",
    comment: "迷宮に隠されたヒントを探して脱出を目指すゲームです。いろいろな場所を調べることで新しい発見があります。"
  },

  {
    title: "ねこの大冒険",
    author: "鈴木 一郎",
    genre: "アクション",
    image: "images/neko.png",
    url: "https://unityroom.com/games/example3",
    comment: "猫を操作してゴールを目指すアクションゲームです。ジャンプをうまく使ってステージを攻略してください。"
  },

  {
    title: "星空パズル",
    author: "田中 美咲",
    genre: "パズル",
    image: "images/hoshizora.png",
    url: "https://unityroom.com/games/example4",
    comment: "星をテーマにしたパズルゲームです。じっくり考えながら遊んでもらえるとうれしいです。"
  },

  {
    title: "ドットレーサー",
    author: "高橋 健",
    genre: "レース",
    image: "images/racer.png",
    url: "https://unityroom.com/games/example5",
    comment: "ドット絵で作ったレースゲームです。最速タイムを目指して何度も挑戦してみてください！"
  },

  {
    title: "おばけ屋敷",
    author: "伊藤 葵",
    genre: "ホラー",
    image: "images/obake.png",
    url: "https://unityroom.com/games/example6",
    comment: "不思議なおばけ屋敷を探索するゲームです。屋敷の中を調べながら出口を探してください。"
  }

];

const list = document.getElementById("games");
const count = document.getElementById("count");
const search = document.getElementById("search");

function render() {

  const q = search.value
    .trim()
    .toLocaleLowerCase();

  const found = games.filter(g =>
    [g.title, g.author, g.genre]
      .some(s =>
        s.toLocaleLowerCase().includes(q)
      )
  );

  count.textContent = `${found.length}作品`;

  list.replaceChildren();

  if (!found.length) {

    const p = document.createElement("p");

    p.textContent = "該当する作品がありません。";

    list.append(p);

    return;
  }

  for (const g of found) {

    const article = document.createElement("article");
    article.className = "game";

    /* 上部 */

    const heading = document.createElement("div");
    heading.className = "heading";

    /* ゲーム画像 */

    const image = document.createElement("img");

    image.className = "game-image";
    image.src = g.image;
    image.alt = `${g.title}のゲーム画像`;

    const info = document.createElement("div");

    const title = document.createElement("h2");
    title.textContent = g.title;

    const author = document.createElement("p");
    author.className = "author";
    author.textContent = `作者：${g.author}`;

    info.append(title, author);

    heading.append(image, info);

    /* ジャンル */

    const genre = document.createElement("span");

    genre.className = "genre";
    genre.textContent = g.genre;

    /* URL */

    const url = document.createElement("a");

    url.className = "url";
    url.textContent = g.url;
    url.href = g.url;

    /* 新しいタブで開く */
    url.target = "_blank";
    url.rel = "noopener noreferrer";

    /* コメント */

    const commentArea = document.createElement("div");
    commentArea.className = "comment-area";

    const comment = document.createElement("p");

    comment.className = "comment collapsed";
    comment.textContent = g.comment;

    /* もっと見る */

    const moreButton = document.createElement("button");

    moreButton.className = "more-button";
    moreButton.type = "button";
    moreButton.textContent = "もっと見る ▼";

    moreButton.addEventListener("click", () => {

      const isCollapsed =
        comment.classList.contains("collapsed");

      if (isCollapsed) {

        comment.classList.remove("collapsed");
        moreButton.textContent = "閉じる ▲";

      } else {

        comment.classList.add("collapsed");
        moreButton.textContent = "もっと見る ▼";

      }

    });

    commentArea.append(
      comment,
      moreButton
    );

    article.append(
      heading,
      genre,
      url,
      commentArea
    );

    list.append(article);

  }

}

search.addEventListener("input", render);

render();

</script>

</body>
</html>

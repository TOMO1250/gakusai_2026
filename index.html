/* 作品一覧の左側に固定する案内欄 */
main{max-width:1250px}

.section-layout {
  display: grid;
  grid-template-columns: 250px minmax(0,1fr) 300px;
  gap: 20px;
  align-items: start;
}

.section-content{min-width:0}
.guide{position:sticky;top:22px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:16px;padding:22px;line-height:1.85;color:#27346a;max-height:calc(100vh - 44px);overflow:auto}
.guide h3{margin:0 0 12px;font-size:1.1rem}
.guide p{margin:0;white-space:pre-line}
.guide-empty{visibility:hidden}
@media(max-width:700px){.section-layout{grid-template-columns:minmax(0,1fr)}.guide{position:static;max-height:none}.guide-empty{display:none}}
/* イラスト拡大表示 */
.modal {
    position: fixed;
    overflow: hidden;
}

.modal-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
}

.modal-content img {
    display: block;
    max-width: 80vw;
    max-height: 72vh;
    width: auto;
    height: auto;
    object-fit: contain;
}

/* 左右の切り替えボタン */
.image-nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 100;
    width: 60px;
    height: 80px;
    border: none;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.15);
    color: white;
    font-size: 42px;
    cursor: pointer;
}

.image-nav:hover {
    background: rgba(255, 255, 255, 0.35);
}

.image-nav.prev {
    left: 20px;
}

.image-nav.next {
    right: 20px;
}
/* SNS欄 */
.sns-guide h4{margin:16px 0 4px;font-size:1rem}
.sns-guide h4:first-of-type{margin-top:0}
.sns-guide a{color:#2563eb;text-decoration:underline;overflow-wrap:anywhere}
.sns-guide a:hover{color:#1d4ed8}

/* 右側の2つの枠 */
.right-sidebar {
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: sticky;
  top: 22px;
  max-height: calc(100vh - 44px);
  overflow-y: auto;
}

.right-sidebar .guide {
  position: static;
  max-height: none;
  flex-shrink: 0;
}

/* 作者コメントの改行を維持 */
.author-comment p {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

@media (max-width: 700px) {
  .right-sidebar {
    position: static;
    max-height: none;
    overflow: visible;
  }
}

/* ===== ゲーム一覧をコンパクトにする ===== */

/* ゲームカード同士の間隔 */
#games {
  gap: 10px;
}

/* ゲームカード全体 */
#games .work-card {
  padding: 12px 14px;
  border-radius: 12px;
}

/* 画像と右側情報 */
#games .heading {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

/* ゲーム画像 */
#games .game-image {
  width: 90px;
  height: 90px;
  border-radius: 9px;
}

/* 画像の右側 */
#games .game-info {
  flex: 1;
  min-width: 0;
}

/* タイトル */
#games h2 {
  font-size: 1.1rem;
  margin: 0 0 3px;
  line-height: 1.4;
}

/* 作者名 */
#games .author {
  margin: 0;
  font-size: 0.9rem;
}

/* ジャンル */
#games .genre {
  margin-top: 5px;
  padding: 2px 9px;
  font-size: 0.75rem;
}

/* URL */
#games .url {
  margin: 5px 0 0;
  font-size: 0.8rem;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

/* コメント欄 */
#games .comment-area {
  margin-top: 9px;
  padding: 8px 11px;
}

/* 説明文：初期表示2行 */
#games .comment {
  font-size: 0.85rem;
  line-height: 1.5;
}

#games .comment.collapsed {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}

/* もっと見る */
#games .more-button {
  padding: 3px 0 0;
  font-size: 0.8rem;
}

/* 右側のSNSとコメント欄 */
.right-sidebar {
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: sticky;
  top: 22px;

  /* 内部スクロールをなくす */
  max-height: none;
  overflow: visible;
}

/* 2つの枠を同じ幅にする */
.right-sidebar .guide {
  position: static;
  width: 100%;
  max-height: none;
  overflow: visible;
  padding: 18px 20px;
}

/* SNSの項目を横並びにする */
.sns-guide .sns-item {
  display: flex;
  align-items: baseline;
  flex-wrap: nowrap;
  gap: 5px;
  margin: 10px 0;
}

.sns-guide .sns-item h4 {
  margin: 0;
  font-size: 0.9rem;
  white-space: nowrap;
}

.sns-guide .sns-item a {
  font-size: 0.9rem;
  white-space: nowrap;
}

/* コメント欄 */
.author-comment p {
  margin: 0;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* 画面幅が狭い場合 */
@media (max-width: 1000px) {
  .section-layout {
    grid-template-columns: 200px minmax(0,1fr) 300px;
    gap: 12px;
  }

  .right-sidebar .guide {
    padding: 14px;
  }
}

@media (max-width: 700px) {
  .section-layout {
    grid-template-columns: minmax(0,1fr);
  }

  .right-sidebar {
    position: static;
  }

// ===== 表示処理：通常は編集不要 =====
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
function makeLink(value){const link=el('a','url',value);if(/^https:\/\//i.test(value)){link.href=value;link.target='_blank';link.rel='noopener noreferrer';}return link;}
function makeCard(title,author){const card=el('article','work-card');card.append(el('h2','',title),el('p','author',`作者：${author}`));return card;}
async function loadDescription(filePath, element) {
  try {
    const response = await fetch(encodeURI(filePath));
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    element.textContent = await response.text();
  } catch (error) {
    console.error("説明文の読み込みに失敗:", filePath, error);
    element.textContent = "説明文を読み込めませんでした。";
  }
}


function renderGames() {
  const q = document.getElementById('search')
    .value.trim().toLocaleLowerCase();

  const filtered = games.filter(g =>
    [g.title, g.author, g.genre].some(v =>
      v.toLocaleLowerCase().includes(q)
    )
  );

  const container = document.getElementById('games');
  container.replaceChildren();

  document.getElementById('count').textContent =
    `${filtered.length}作品`;

  if (!filtered.length) {
    container.append(el('p', '', '該当する作品がありません。'));
    return;
  }

  for (const g of filtered) {
    const card = el('article', 'work-card');
    const heading = el('div', 'heading');
    const info = el('div', 'game-info');

    // タイトルと作者
    info.append(
      el('h2', '', g.title),
      el('p', 'author', `作者：${g.author}`)
    );

    // ジャンルとURLも画像の右側に配置
    info.append(
      el('span', 'genre', g.genre),
      makeLink(g.url)
    );

    // ゲーム画像
    if (g.image) {
      const img = el('img', 'game-image');
      img.src = g.image;
      img.alt = `${g.title}の画像`;
      img.loading = 'lazy';
      heading.append(img);
    }

    heading.append(info);
    card.append(heading);

    // コメント欄
    if (g.commentFile) {
      const area = el('div', 'comment-area');
      const comment = el(
        'p', 'comment collapsed', '読み込み中...'
      );

      const more = el(
        'button', 'more-button', 'もっと見る ▼'
      );

      more.type = 'button';
      more.hidden = true;

      more.addEventListener('click', () => {
        const collapsed =
          comment.classList.toggle('collapsed');

        more.textContent = collapsed
          ? 'もっと見る ▼'
          : '閉じる ▲';
      });

      area.append(comment, more);
      card.append(area);

      loadDescription(g.commentFile, comment).then(() => {
        requestAnimationFrame(() => {
          more.hidden =
            comment.scrollHeight <= comment.clientHeight + 2;
        });
      });
    }

    container.append(card);
  }
}

const modal = document.getElementById('imageModal');
const modalImage = document.getElementById('modalImage');
const modalPdf = document.getElementById('modalPdf');
const modalPdfLink = document.getElementById('modalPdfLink');

let currentImageIndex = 0;
let displayedIllustrations = illustrations;

function illustrationPath(item) {
    return item.pdf || item.image || '';
}
function isPdfIllustration(item) {
    return /\.pdf(?:[?#].*)?$/i.test(illustrationPath(item));
}

// PNG/JPGとPDFを共通のモーダルで表示
function showImage(index) {
    if (displayedIllustrations.length === 0) return;
    currentImageIndex = (index + displayedIllustrations.length) % displayedIllustrations.length;
    const item = displayedIllustrations[currentImageIndex];
    const path = illustrationPath(item);
    const pdf = isPdfIllustration(item);

    modalImage.style.display = pdf ? 'none' : 'block';
    modalPdf.style.display = pdf ? 'block' : 'none';
    modalPdfLink.style.display = pdf ? 'inline-block' : 'none';
    if (pdf) {
        modalImage.removeAttribute('src');
        modalPdf.src = encodeURI(path);
        modalPdfLink.href = encodeURI(path);
    } else {
        modalPdf.removeAttribute('src');
        modalPdfLink.removeAttribute('href');
        modalImage.src = encodeURI(path);
        modalImage.alt = item.title;
    }
    document.getElementById('modalTitle').textContent = item.title;
    document.getElementById('modalAuthor').textContent = `作者：${item.author}`;
}

// 閉じたときPDFの読み込みを停止
modal.addEventListener('close', () => {
    modalPdf.removeAttribute('src');
});

// 次のイラスト
function nextImage() {
    showImage(currentImageIndex + 1);
}

// 前のイラスト
function prevImage() {
    showImage(currentImageIndex - 1);
}

// 左右ボタンのクリック処理
document.getElementById('nextImage').addEventListener('click', nextImage);
document.getElementById('prevImage').addEventListener('click', prevImage);

// キーボードの左右キーでも切り替え
document.addEventListener('keydown', function(event) {
    if (!modal.open) return;

    if (event.key === 'ArrowRight') {
        event.preventDefault();
        nextImage();
    }

    if (event.key === 'ArrowLeft') {
        event.preventDefault();
        prevImage();
    }
});

// イラスト一覧を表示する
function renderIllustrations() {
    const q = document.getElementById('illustration-search')
        .value.trim().toLocaleLowerCase();

    const filtered = illustrations.filter(item =>
        [item.title, item.author].some(v =>
            v.toLocaleLowerCase().includes(q)
        )
    );

    displayedIllustrations = filtered;

    const container = document.getElementById('illustrations');
    container.replaceChildren();

    document.getElementById('illustration-count').textContent =
        `${filtered.length}作品`;

    if (!filtered.length) {
        container.append(el('p', '', '該当する作品がありません。'));
        return;
    }

    filtered.forEach((item, index) => {
        const card = el('article', 'illustration-card');

        const button = el('button', 'illustration-open');
        button.type = 'button';
        button.setAttribute('aria-label', `${item.title}を拡大`);

        if (isPdfIllustration(item)) {
            // PDFはimgタグでは表示できないため専用のサムネイルを表示
            const thumb = el('div', 'pdf-thumbnail');
            thumb.append(el('span', 'pdf-symbol', '📄'), el('span', '', 'PDF作品を見る'));
            button.append(thumb);
        } else {
            const img = el('img');
            img.src = encodeURI(illustrationPath(item));
            img.alt = item.title;
            img.loading = 'lazy';
            button.append(img);
        }

        button.addEventListener('click', () => {
            showImage(index);
            modal.showModal();
        });

        const info = el('div', 'illustration-info');

        info.append(
            el('p', 'illustration-title', item.title),
            el('p', 'illustration-author', `作者：${item.author}`)
        );

        card.append(button, info);
        container.append(card);
    });
}

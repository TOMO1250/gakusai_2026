t-line-clamp:3;overflow:hidden}.more-button{border:0;background:none;color:#2563eb;font-weight:700;padding:7px 0 0;cursor:pointer;font-size:.9rem}.illustration-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.illustration-card{background:white;border:1px solid #e2e8f0;border-radius:15px;overflow:hidden;box-shadow:0 5px 18px #1e293b0d}.illustration-open{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}.illustration-open img{display:block;width:100%;object-fit:contain;background:#f1f5f9}.illustration-info{padding:12px;text-align:center}.illustration-title{margin:0 0 4px;font-weight:700}.illustration-author{margin:0;color:#64748b;font-size:.9rem}.modal{border:0;background:rgba(0,0,0,.92);color:white;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:35px 20px;text-align:center}.modal::backdrop{background:rgba(0,0,0,.92)}.modal img{max-width:90vw;max-height:78vh;object-fit:contain}.modal p{margin:8px}.close-modal{position:fixed;top:12px;right:20px;border:0;background:none;color:white;font-size:2.5rem;cursor:pointer}footer{text-align:center;color:#64748b;font-size:.85rem;padding:0 20px 35px}@media(max-width:600px){.category-menu{grid-template-columns:repeat(2,minmax(0,1fr))}.illustration-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.work-card{padding:16px}.game-image{width:80px;height:80px}}

// 音楽・動画は YouTube の限定公開共有URLを　url に指定します。
const musics = [
  {title:"始まり",author:"よーき",url:"https://youtu.be/kr_iKdwulMA"},
  {title:"晴零",author:"よーき",url:"https://youtu.be/j0NWs42hwsk"},
  {title:"忙しい人のためのバラード",author:"よーき",url:"https://youtu.be/PEF8HSHZzZ8"}
];
const videos = [
  {title:"自主制作アニメーション",author:"田中 美咲",url:"https://youtu.be/VIDEO_ID_4"},
  {title:"3DCG作品",author:"高橋 健",url:"https://youtu.be/VIDEO_ID_5"}

const illustrations = [
  {title:"予備",author:"佐藤 花子",image:"images/illustrations/S__34054147.jpg"},
  {title:"トリックオアトリート！",author:"アイス",image:"images/illustrations/S__77094920.jpg"},
  {title:"お菓子はいいから休みをちょうだい!",author:"ねこぜ",image:"images/illustrations/S__5169161.jpg"},

  {title:"その後",author:"Chihiro",image:"images/illustrations/S__14098439.jpg"},
　{title:"ショコラマジック",author:"こすい",image:"images/illustrations/S__33767428.jpg"},
];
// ===== 表示処理：通常は編集不要 =====
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
function makeLink(value){const link=el('a','url',value);if(/^https:\/\//i.test(value)){link.href=value;link.target='_blank';link.rel='noopener noreferrer';}return link;}
function makeCard(title,author){const card=el('article','work-card');card.append(el('h2','',title),el('p','author',`作者：${author}`));return card;}
async function loadDescription(filePath, element) {
  try {
    const response = await fetch(encodeURI(filePath));
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    element.textContent = await response.text();
  } catch (error) {
    console.error("説明文の読み込みに失敗:", filePath, error);
    element.textContent = "説明文を読み込めませんでした。";
  }
}

function renderGames() {
  const q = document.getElementById('search').value.trim().toLocaleLowerCase();
  const filtered = games.filter(g =>
    [g.title, g.author, g.genre].some(v => v.toLocaleLowerCase().includes(q))
  );
  const container = document.getElementById('games');
  container.replaceChildren();
  document.getElementById('count').textContent = `${filtered.length}作品`;
  if (!filtered.length) {
    container.append(el('p', '', '該当する作品がありません。'));
    return;
  }
  for (const g of filtered) {
    const card = el('article', 'work-card');
    const heading = el('div', 'heading');
    const info = el('div');
    info.append(el('h2', '', g.title), el('p', 'author', `作者：${g.author}`));
    if (g.image) {
      const img = el('img', 'game-image');
      img.src = g.image;
      img.alt = `${g.title}の画像`;
      img.loading = 'lazy';
      heading.append(img);
    }
    heading.append(info);
    card.append(heading, el('span', 'genre', g.genre), makeLink(g.url));
    if (g.commentFile) {
      const area = el('div', 'comment-area');
      const comment = el('p', 'comment collapsed', '読み込み中...');
      const more = el('button', 'more-button', 'もっと見る ▼');
      more.type = 'button';
      more.hidden = true;
      more.addEventListener('click', () => {
        const collapsed = comment.classList.toggle('collapsed');
        more.textContent = collapsed ? 'もっと見る ▼' : '閉じる ▲';
      });
      area.append(comment, more);
      card.append(area);
      loadDescription(g.commentFile, comment).then(() => {
        requestAnimationFrame(() => {
          more.hidden = comment.scrollHeight <= comment.clientHeight + 2;
        });
      });
    }
    container.append(card);
  }
}
function renderLinks(items,id,searchId,countId){const q=document.getElementById(searchId).value.trim().toLocaleLowerCase();const filtered=items.filter(item=>[item.title,item.author].some(v=>v.toLocaleLowerCase().includes(q)));const container=document.getElementById(id);container.replaceChildren();document.getElementById(countId).textContent=`${filtered.length}作品`;if(!filtered.length){container.append(el('p','','該当する作品がありません。'));return;}for(const item of filtered){const card=makeCard(item.title,item.author);card.append(makeLink(item.url));container.append(card);}}
const modal = document.getElementById('imageModal');
const modalImage = document.getElementById('modalImage');

let currentImageIndex = 0;
let displayedIllustrations = illustrations;

// 指定した番号のイラストを表示する
function showImage(index) {
    if (displayedIllustrations.length === 0) return;

    currentImageIndex =
        (index + displayedIllustrations.length) % displayedIllustrations.length;

    const item = displayedIllustrations[currentImageIndex];

    modalImage.src = item.image;
    modalImage.alt = item.title;

    document.getElementById('modalTitle').textContent = item.title;
    document.getElementById('modalAuthor').textContent =
        `作者：${item.author}`;
}

// 次のイラスト
function nextImage() {
    showImage(currentImageIndex + 1);
}

// 前のイラスト
function prevImage() {
    showImage(currentImageIndex - 1);
}

// 左右ボタンのクリック処理
document.getElementById('nextImage').addEventListener('click', nextImage);
document.getElementById('prevImage').addEventListener('click', prevImage);

// キーボードの左右キーでも切り替え
document.addEventListener('keydown', function(event) {
    if (!modal.open) return;

    if (event.key === 'ArrowRight') {
        event.preventDefault();
        nextImage();
    }

    if (event.key === 'ArrowLeft') {
        event.preventDefault();
        prevImage();
    }
});

// イラスト一覧を表示する
function renderIllustrations() {
    const q = document.getElementById('illustration-search')
        .value.trim().toLocaleLowerCase();

    const filtered = illustrations.filter(item =>
        [item.title, item.author].some(v =>
            v.toLocaleLowerCase().includes(q)
        )
    );

    displayedIllustrations = filtered;

    const container = document.getElementById('illustrations');
    container.replaceChildren();

    document.getElementById('illustration-count').textContent =
        `${filtered.length}作品`;

    if (!filtered.length) {
        container.append(el('p', '', '該当する作品がありません。'));
        return;
    }

    filtered.forEach((item, index) => {
        const card = el('article', 'illustration-card');

        const button = el('button', 'illustration-open');
        button.type = 'button';
        button.setAttribute('aria-label', `${item.title}を拡大`);

        const img = el('img');
        img.src = item.image;
        img.alt = item.title;
        img.loading = 'lazy';

        button.append(img);

        button.addEventListener('click', () => {
            showImage(index);
            modal.showModal();
        });

        const info = el('div', 'illustration-info');

        info.append(
            el('p', 'illustration-title', item.title),
            el('p', 'illustration-author', `作者：${item.author}`)
        );

        card.append(button, info);
        container.append(card);
    });
}
document.querySelectorAll('.category-button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.category-button').forEach(b=>{const active=b===button;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});document.querySelectorAll('.section').forEach(section=>section.hidden=section.id!==button.dataset.section);window.scrollTo({top:0,behavior:'instant'});}));document.getElementById('search').addEventListener('input',renderGames);document.getElementById('closeModal').addEventListener('click',()=>modal.close());modal.addEventListener('click',event=>{if(event.target===modal)modal.close();});renderGames();document.getElementById('music-search').addEventListener('input',()=>renderLinks(musics,'musics','music-search','music-count'));document.getElementById('video-search').addEventListener('input',()=>renderLinks(videos,'videos','video-search','video-count'));document.getElementById('illustration-search').addEventListener('input',renderIllustrations);renderLinks(musics,'musics','music-search','music-count');renderLinks(videos,'videos','video-search','video-count');renderIllustrations();
</script>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>無限スライム牧場</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #faf8ef; color: #294338; font-family: system-ui, sans-serif; overflow: hidden; }
    body { display: grid; grid-template-rows: minmax(0, 1fr) 36px; }
    main { display: flex; align-items: center; justify-content: center; min-height: 0; }
    #garden { width: 100%; height: 100%; position: relative; }
    canvas { display: block; width: 100%; height: 100%; outline: none; background: #a6c8bd; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center; background: #faf8ef; }
    h1 { font-size: clamp(18px, 3vw, 28px); margin: 0; font-weight: 600; }
    progress { width: 220px; max-width: 70vw; height: 8px; accent-color: #94d3a4; }
    #warning { position: absolute; inset: 8%; background: #53372e; padding: 20px; overflow: auto; white-space: pre-wrap; display: none; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; font-size: 11px; }
    button { color: inherit; background: #e1ebd9; border: 1px solid #799d85; border-radius: 8px; padding: 4px 12px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #garden:fullscreen { width: 100vw; height: 100vh; background: #233f36; display: grid; place-items: center; }
    #garden:fullscreen canvas { width: 100%; height: 100%; }
    @supports (height: 100dvh) { body { height: 100dvh; } }
  </style>
</head>
<body>
  <main><div id="garden">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="無限スライム牧場のゲーム画面"></canvas>
    <div id="loading"><h1>無限スライム牧場</h1><div>牧場で、会いましょう。</div><progress id="progress" max="1" value="0" aria-label="読み込み"></progress></div>
    <div id="warning" role="alert"></div>
  </div></main>
  <footer><span>セーブは、このブラウザに。 · UI 2026.09</span><button id="fullscreen" disabled>全画面</button></footer>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const warning = document.getElementById('warning');
    function showBanner(message, type) {
      if (type === 'error') { warning.textContent = message; warning.style.display = 'block'; }
      else console.warn(message);
    }
    const script = document.createElement('script');
    script.src = 'Build/WebGL-2026-11-01.loader.js';
    script.onerror = () => showBanner('ゲームの読み込みに失敗しました。通信を確認して再読み込みしてください。', 'error');
    script.onload = () => createUnityInstance(canvas, {
      dataUrl: 'Build/WebGL-2026-11-01.data',
      frameworkUrl: 'Build/WebGL-2026-11-01.framework.js',
      codeUrl: 'Build/WebGL-2026-11-01.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "DefaultCompany",
      productName: "SlimeFarm",
      productVersion: "0.1.0",
      showBanner
    }, value => { document.getElementById('progress').value = value; }).then(() => {
      document.getElementById('loading').style.display = 'none';
      const fullscreen = document.getElementById('fullscreen');
      fullscreen.disabled = !document.fullscreenEnabled;
      fullscreen.onclick = () => document.getElementById('garden').requestFullscreen().catch(error => console.warn(error));
    }).catch(error => showBanner(String(error), 'error'));
    document.body.appendChild(script);
  </script>
</body>
</html>
